name: Deploy to AWS EC2

on:
  push:
    branches:
      - pre-production

# Required for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Setup build tools ───────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # ─── Build ───────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install

      - name: Build API server
        run: pnpm run build

      - name: Build frontend
        run: pnpm --filter @workspace/dev-tracker run build

      # ─── AWS Auth via OIDC (no keys!) ────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-tracker-deploy
          aws-region: ap-southeast-1   # ← change to your region

      # ─── Deploy via SSM ──────────────────────────────────
      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/www/dev_tracker",
              "git pull origin pre-production",
              "pnpm install --frozen-lockfile",
              "pnpm run build",
              "pnpm --filter @workspace/dev-tracker run build",
              "pm2 restart tracker-api",
              "sudo systemctl reload nginx",
              "echo Deployment successful!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to finish (timeout 5 min)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      # ─── Print deploy output ─────────────────────────────
      - name: Get deploy output
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text