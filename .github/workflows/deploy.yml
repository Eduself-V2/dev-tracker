name: Deploy to AWS EC2

on:
  push:
    branches:
      - pre-production

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Setup build tools ───────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"

      # ─── Pre-check build (catch errors before hitting EC2) ─
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/dev-tracker run build

      # ─── AWS Auth via OIDC ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-tracker-deploy
          aws-region: ap-southeast-1

      # ─── Deploy + Print output in one step ───────────────
      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /var/www/dev_tracker",
              "git pull origin pre-production",
              "pnpm install --no-frozen-lockfile",
              "pnpm --filter @workspace/api-server run build",
              "pnpm --filter @workspace/dev-tracker run build",
              "pm2 restart tracker-api",
              "sudo systemctl reload nginx",
              "echo Deployment successful!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to finish (timeout 5 min)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Print output — same step so COMMAND_ID is available
          echo "=== Deploy Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "=== Deploy Errors (if any) ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text
