name: Deploy to AWS EC2 (Ihsan Mart)

on:
  push:
    branches:
      - ihsan-mart-production

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── Checkout ────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Setup build tools ───────────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.3.0"

      # ─── Pre-check build (catch errors before hitting EC2) ─
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/dev-tracker run build
        env:
          PORT: "3000"
          BASE_PATH: "/"

      # ─── AWS Auth via OIDC ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.IHSAN_MART_AWS_ACCOUNT_ID }}:role/github-actions-tracker-deploy
          aws-region: ap-south-1

      # ─── Deploy + Print output in one step ───────────────
      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.IHSAN_MART_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "export PATH=$PATH:/usr/local/bin:/usr/bin",
              "export HOME=/root",
              "export CI=true",
              "git config --system --add safe.directory /var/www/dev_tracker",
              "corepack enable",
              "corepack prepare pnpm@11.3.0 --activate",
              "cd /var/www/dev_tracker",
              "git fetch origin ihsan-mart-production",
              "git reset --hard origin/ihsan-mart-production",
              "pnpm install --frozen-lockfile",
              "pnpm --filter @workspace/api-server run build",
              "PORT=3000 BASE_PATH=/ pnpm --filter @workspace/dev-tracker run build",
              "su - ubuntu -c \"pm2 restart tracker-api\"",
              "systemctl reload nginx",
              "echo Deployment successful!"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.IHSAN_MART_EC2_INSTANCE_ID }}" || true

          echo "=== Deploy Status ==="
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.IHSAN_MART_EC2_INSTANCE_ID }}" \
            --query "StatusDetails" \
            --output text)
          echo "Status: $STATUS"

          echo "=== Deploy Output ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.IHSAN_MART_EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          echo "=== Deploy Errors ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.IHSAN_MART_EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text

          [ "$STATUS" = "Success" ] || exit 1
